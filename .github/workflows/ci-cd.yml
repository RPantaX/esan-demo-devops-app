name: CI/CD mi-app

# 1. EVENTO: cuándo se ejecuta el pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  # ---------- CI: probar cada cambio ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------- CD: construir y publicar la imagen Docker ----------
  build-push:
    needs: test # solo corre si los tests pasaron
    if: github.event_name != 'pull_request' # en PRs solo probamos, no publicamos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # El registro exige el nombre en minúsculas
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # ---------- DEPLOY a Kubernetes (opcional) ----------
  # Requiere un clúster real y el secreto KUBECONFIG en
  # Settings > Secrets and variables > Actions.
  # Quita los "#" solo si tienes el clúster listo.
